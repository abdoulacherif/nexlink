<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge Mobile - Flinpay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header .subtitle {
            color: #888;
            font-size: 14px;
        }

        .header .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 8px;
        }

        .amount-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .amount-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            color: #333;
        }

        .amount-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .amount-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .custom-amount {
            margin-bottom: 20px;
        }

        .custom-amount label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group {
            position: relative;
        }

        .input-group span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 600;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 35px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
            background: white;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #667eea;
        }

        .pay-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .pay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .pay-btn:active {
            transform: translateY(0);
        }

        .pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.loading {
            display: block;
            background: #e7f3ff;
            color: #004085;
            border: 1px solid #b8daff;
        }

        .message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #667eea;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .payment-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }

        .payment-info strong {
            color: #333;
        }

        .secure-badge {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }

        .secure-badge i {
            margin-right: 5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .amount-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Recharge Mobile</h1>
            <p class="subtitle">Effectuez un paiement sécurisé</p>
            <span class="badge">🔒 Paiement sécurisé</span>
        </div>

        <div class="amount-options">
            <button class="amount-btn" data-amount="500">500 F</button>
            <button class="amount-btn active" data-amount="1000">1 000 F</button>
            <button class="amount-btn" data-amount="2000">2 000 F</button>
            <button class="amount-btn" data-amount="5000">5 000 F</button>
            <button class="amount-btn" data-amount="10000">10 000 F</button>
            <button class="amount-btn" data-amount="25000">25 000 F</button>
        </div>

        <div class="custom-amount">
            <label>Montant personnalisé</label>
            <div class="input-group">
                <span>F</span>
                <input type="number" id="customAmount" placeholder="Saisissez un montant" min="50" step="50">
            </div>
        </div>

        <div class="form-group">
            <label>📱 Numéro de téléphone</label>
            <input type="tel" id="phoneNumber" placeholder="Ex: 77 123 45 67" maxlength="15">
        </div>

        <div class="form-group">
            <label>👤 Nom du bénéficiaire</label>
            <input type="text" id="beneficiary" placeholder="Nom du destinataire (optionnel)">
        </div>

        <div class="form-group">
            <label>🏦 Opérateur</label>
            <select id="operator">
                <option value="orange">Orange Money</option>
                <option value="mtn">MTN Mobile Money</option>
                <option value="wave">Wave</option>
                <option value="free">Free Money</option>
            </select>
        </div>

        <div class="payment-info">
            <p><strong>🔒 Transaction sécurisée</strong></p>
            <p style="font-size: 12px; margin-top: 5px;">Paiement traité par Flinpay</p>
        </div>

        <button class="pay-btn" id="payBtn">💳 Effectuer le paiement</button>

        <div class="message" id="message"></div>
        
        <div class="secure-badge">
            <i>🔐</i> Vos données sont cryptées et sécurisées
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // API Configuration
            const API_KEY = 'fp_live_7b9be8a90d72be85b73ea0c246c6c3926b9731de64709e26';
            const API_URL = 'https://flinpay.vercel.app/api/payment'; // URL de l'API Flinpay

            // DOM Elements
            const amountBtns = document.querySelectorAll('.amount-btn');
            const customAmount = document.getElementById('customAmount');
            const phoneNumber = document.getElementById('phoneNumber');
            const beneficiary = document.getElementById('beneficiary');
            const operator = document.getElementById('operator');
            const payBtn = document.getElementById('payBtn');
            const message = document.getElementById('message');

            let selectedAmount = 1000; // Montant par défaut

            // Gestion des boutons de montant
            amountBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    amountBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedAmount = parseInt(this.dataset.amount);
                    customAmount.value = '';
                });
            });

            // Gestion du montant personnalisé
            customAmount.addEventListener('input', function() {
                amountBtns.forEach(b => b.classList.remove('active'));
                if (this.value) {
                    selectedAmount = parseInt(this.value);
                }
            });

            // Fonction pour afficher les messages
            function showMessage(text, type = 'loading') {
                message.className = 'message ' + type;
                message.innerHTML = text;
            }

            function hideMessage() {
                message.className = 'message';
                message.innerHTML = '';
            }

            // Fonction de paiement
            async function processPayment() {
                // Validation du montant
                if (!selectedAmount || selectedAmount < 50) {
                    showMessage('⚠️ Veuillez saisir un montant valide (minimum 50 F)', 'error');
                    return;
                }

                // Validation du numéro de téléphone
                const phone = phoneNumber.value.trim();
                if (!phone || phone.length < 8) {
                    showMessage('⚠️ Veuillez saisir un numéro de téléphone valide', 'error');
                    return;
                }

                // Désactivation du bouton
                payBtn.disabled = true;
                payBtn.innerHTML = '<span class="loader"></span> Traitement en cours...';

                // Affichage du message de chargement
                showMessage('⏳ Connexion à Flinpay...', 'loading');

                try {
                    // Préparation des données pour l'API Flinpay
                    const paymentData = {
                        amount: selectedAmount,
                        currency: 'XOF',
                        phone: phone,
                        beneficiary: beneficiary.value.trim() || 'Client',
                        operator: operator.value,
                        description: `Recharge de ${selectedAmount} FCFA via ${operator.value}`,
                        reference: 'RECH-' + Date.now(),
                        return_url: window.location.href,
                        callback_url: window.location.href,
                        api_key: API_KEY
                    };

                    // Appel à l'API Flinpay
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + API_KEY,
                            'X-API-Key': API_KEY
                        },
                        body: JSON.stringify(paymentData)
                    });

                    // Gestion de la réponse
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || 'Erreur lors du paiement');
                    }

                    const data = await response.json();

                    // Traitement de la réponse
                    if (data.success === true || data.status === 'success') {
                        showMessage(
                            `✅ Paiement de <strong>${selectedAmount} FCFA</strong> réussi !<br>` +
                            `📱 Téléphone: ${phone}<br>` +
                            `🏦 Opérateur: ${operator.options[operator.selectedIndex].text}<br>` +
                            `🆔 Référence: ${data.transaction_id || data.reference || 'TXN-' + Date.now()}<br><br>` +
                            `📧 Un reçu vous a été envoyé par email.`,
                            'success'
                        );

                        // Réinitialisation après succès
                        setTimeout(() => {
                            hideMessage();
                            amountBtns.forEach(b => b.classList.remove('active'));
                            document.querySelector('.amount-btn[data-amount="1000"]').classList.add('active');
                            selectedAmount = 1000;
                            customAmount.value = '';
                            phoneNumber.value = '';
                            beneficiary.value = '';
                        }, 8000);
                    } else {
                        throw new Error(data.message || 'Paiement échoué');
                    }

                } catch (error) {
                    console.error('Erreur de paiement:', error);
                    showMessage(
                        `❌ Erreur lors du paiement<br>` +
                        `<span style="font-size: 12px;">${error.message || 'Veuillez réessayer plus tard'}</span>`,
                        'error'
                    );
                } finally {
                    // Réactivation du bouton
                    payBtn.disabled = false;
                    payBtn.innerHTML = '💳 Effectuer le paiement';
                }
            }

            // Écouteur d'événement sur le bouton de paiement
            payBtn.addEventListener('click', processPayment);

            // Validation de l'enter sur les champs
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const activeElement = document.activeElement;
                    if (activeElement.tagName === 'INPUT') {
                        processPayment();
                    }
                }
            });

            // Gestion du montant personnalisé : si vide, revenir à la sélection
            customAmount.addEventListener('blur', function() {
                if (!this.value) {
                    amountBtns.forEach(b => {
                        if (parseInt(b.dataset.amount) === selectedAmount) {
                            b.classList.add('active');
                        }
                    });
                }
            });

            // Fonction pour formater le numéro de téléphone
            phoneNumber.addEventListener('input', function() {
                let value = this.value.replace(/\D/g, '');
                if (value.length > 8) {
                    value = value.slice(0, 8);
                }
                if (value.length > 4) {
                    value = value.slice(0, 4) + ' ' + value.slice(4);
                }
                this.value = value;
            });

            // Message d'information initial
            showMessage('💡 Choisissez un montant, remplissez les champs et validez', 'info');
            setTimeout(hideMessage, 4000);

            // Test de connexion à l'API
            async function testApiConnection() {
                try {
                    const testResponse = await fetch(API_URL, {
                        method: 'HEAD',
                        headers: {
                            'Authorization': 'Bearer ' + API_KEY
                        }
                    });
                    if (testResponse.ok) {
                        console.log('✅ Connexion à Flinpay API établie');
                    }
                } catch (error) {
                    console.warn('⚠️ Impossible de contacter Flinpay API:', error.message);
                }
            }
            testApiConnection();

        });
    </script>
</body>
</html>
