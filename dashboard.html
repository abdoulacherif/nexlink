<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon tableau de bord — Kontak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <a class="logo" href="index.html">Kon<span>tak</span></a>
  <div class="header-actions">
    <a class="btn-line" href="admin.html" data-auth="admin">Admin</a>
    <a class="btn-line" href="index.html">Annuaire</a>
    <a class="btn-fill" href="#" data-action="logout">Déconnexion</a>
  </div>
</header>

<div id="gateMsg" class="gate" style="display:none;">
  <h2>Connexion requise</h2>
  <p>Tu dois être connecté pour accéder à ton tableau de bord.</p>
  <br>
  <a class="btn-fill" href="connexion.html">Se connecter</a>
</div>

<div id="dashContent" style="display:none;">
  <section class="hero" style="padding-bottom:16px;">
    <div class="eyebrow">Mon espace</div>
    <h1 id="dashGreeting">Tableau de bord</h1>
    <p>Gère les informations visibles sur ta fiche dans l'annuaire.</p>
  </section>

  <div class="page-narrow">
    <div class="card" style="margin-bottom:16px;">
      <div class="card-top">
        <div class="avatar-ring"><div class="avatar" id="dashAvatar">--</div></div>
        <div>
          <div class="card-name" id="dashBusiness">—</div>
          <div class="card-city" id="dashLocation">—</div>
          <span class="card-cat" id="dashSector">—</span>
        </div>
      </div>
      <div class="card-owner" id="dashOwner">—</div>
    </div>

    <div class="panel">
      <form id="dashForm">
        <div class="field"><label>Nom complet</label><input type="text" id="d-name" required></div>
        <div class="field"><label>Numéro WhatsApp</label><input type="tel" id="d-phone" required></div>
        <div class="field"><label>Pays</label><input type="text" id="d-country" required></div>
        <div class="field"><label>Ville</label><input type="text" id="d-city" required></div>
        <div class="field"><label>Nom du business</label><input type="text" id="d-business" required></div>
        <div class="field"><label>Secteur d'activité</label><select id="d-sector" required></select></div>
        <div class="err-msg" id="errDash"></div>
        <div class="form-actions">
          <button type="button" class="btn-ghost" onclick="deleteMyProfile()">Supprimer ma fiche</button>
          <button type="submit" class="btn-primary" id="dashSaveBtn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script>
document.getElementById('d-sector').innerHTML = SECTORS.map(s=>`<option>${s}</option>`).join('');

function fillDashboard(p){
  document.getElementById('dashGreeting').textContent = 'Bonjour ' + (p.nom || '');
  document.getElementById('dashAvatar').textContent = initials(p.business || p.nom);
  document.getElementById('dashBusiness').textContent = p.business || p.nom || '—';
  document.getElementById('dashLocation').textContent = [p.ville,p.pays].filter(Boolean).join(', ') || '—';
  document.getElementById('dashSector').textContent = p.secteur || '—';
  document.getElementById('dashOwner').textContent = 'Par ' + (p.nom || '—');
  document.getElementById('d-name').value = p.nom || '';
  document.getElementById('d-phone').value = p.whatsapp || '';
  document.getElementById('d-country').value = p.pays || '';
  document.getElementById('d-city').value = p.ville || '';
  document.getElementById('d-business').value = p.business || '';
  document.getElementById('d-sector').value = p.secteur || '';
}

document.getElementById('dashForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('dashSaveBtn');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  const updated = {
    nom: document.getElementById('d-name').value.trim(),
    whatsapp: document.getElementById('d-phone').value.trim(),
    pays: document.getElementById('d-country').value.trim(),
    ville: document.getElementById('d-city').value.trim(),
    business: document.getElementById('d-business').value.trim(),
    secteur: document.getElementById('d-sector').value
  };
  try{
    const { error } = await sb.from('profiles').update(updated).eq('user_id', CURRENT_USER.id);
    if(error) throw error;
    hideErr('errDash');
    fillDashboard(updated);
    showToast('Profil mis à jour ✓');
  }catch(err){
    showErr('errDash', err.message || "Erreur lors de l'enregistrement.");
  }finally{
    btn.disabled = false; btn.textContent = 'Enregistrer';
  }
});

async function deleteMyProfile(){
  if(!confirm('Supprimer définitivement ta fiche de l\'annuaire ?')) return;
  try{
    const { error } = await sb.from('profiles').delete().eq('user_id', CURRENT_USER.id);
    if(error) throw error;
    showToast('Fiche supprimée');
    await sb.auth.signOut();
    window.location.href = 'index.html';
  }catch(err){
    showErr('errDash', err.message || "Erreur lors de la suppression.");
  }
}

(async ()=>{
  const { user, profile } = await initNav();
  if(!user){
    document.getElementById('gateMsg').style.display = '';
    return;
  }
  if(!profile){
    document.getElementById('gateMsg').style.display = '';
    document.getElementById('gateMsg').innerHTML = '<h2>Profil introuvable</h2><p>Contacte l\'administrateur.</p>';
    return;
  }
  document.getElementById('dashContent').style.display = '';
  fillDashboard(profile);
})();
</script>
</body>
</html>
